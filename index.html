function nid(){var a=new Uint8Array(6);crypto.getRandomValues(a);return[].map.call(a,function(b){return('0'+b.toString(16)).slice(-2)}).join('')}
function clean(x){return JSON.parse(JSON.stringify(x))}
function uOf(user){if(!user)return null;for(var k in EM)if(EM[k]===user.email)return k;return null}
function wDef(){return{entries:[],ops:[],notes:[]}}
function wFrom(s){return s.exists?Object.assign(wDef(),s.data()):wDef()}
function wGet(u){return ref('w_'+u).get().then(wFrom)}
function wMod(u,fn){var r=ref('w_'+u);return db.runTransaction(function(t){return t.get(r).then(function(s){var w=wFrom(s);fn(w);t.set(r,w)})}).then(function(){return{ok:1}})}
function ent(amt,desc,auto){return{id:nid(),ts:NOW(),amount:Math.round(amt*100)/100,desc:desc,auto:!!auto}}
function trFrom(s){return s.exists?(s.data().list||[]):[]}
function bad(m){throw new Error(m)}
function lMod(n,fn){var r=ref(n);return db.runTransaction(function(t){return t.get(r).then(function(s){var l=trFrom(s);fn(l);t.set(r,{list:clean(l)})})}).then(function(){return{ok:1}})}
var STAT={aperta:'Aperta',corso:'In corso',fatta:'Completata',no:'Rifiutata'},CAT={idea:'Idea',novita:'Novità per il sito',bug:'Problema',altro:'Altro'},TRS={pending:'In attesa',ok:'Accettato',no:'Rifiutato',cx:'Annullato'};

  var ops=[['AVIATOR SNAI PERSO TRAPANI',60,50],['Snai Miriam',60,0],['Sisal Miriam',25,0],['Eurobet Nives',100,0]].map(function(o,i){return{id:nid(),ts:ts+i,sito:o[0],caricato:o[1],tornato:o[2]}});
  var calc={id:nid(),name:'Calcolo attuale',budget:'400',persone:'2',vincita:'880',qualifica:'0',steps:[
    {partita:'',quota:'',puntata:'',nonCop:true,vinta:false},
    {partita:'',quota:'',puntata:'63',nonCop:false,vinta:true},
    {partita:'viking - bayern U 1,5 2T Ospite',quota:'2.35',puntata:'117',nonCop:false,vinta:false},
    {partita:'LASK - LIVERPOOL U 1.5 2 tempo',quota:'2.35',puntata:'204',nonCop:false,vinta:false},
    {partita:'Manchster city - PSG U 1.5 2 tempo',quota:'2.15',puntata:'416',nonCop:false,vinta:false}]};
  return{
    w_biagio:{entries:[],ops:ops,notes:[]},
    w_mario:wDef(),
    tr:{list:[{id:nid(),ts:ts,from:'biagio',to:'mario',amount:0.1,status:'no'}]},
    calc:{rev:1,data:{pages:[calc]},by:'biagio',ts:ts},
    clients:{rev:1,data:{list:[]},by:'biagio',ts:ts}
  };
}
function seed(){
  var it=seedItems();
  return Promise.all(Object.keys(it).map(function(k){var r=ref(k);return db.runTransaction(function(t){return t.get(r).then(function(s){if(!s.exists)t.set(r,it[k])})})}));
}
function authErr(e){
  var c=e&&e.code||'';
  if(c==='auth/too-many-requests')return new Error('Troppi tentativi, riprova tra qualche minuto');
  if(c==='auth/network-request-failed')return new Error('Nessuna connessione');
  if(/auth\//.test(c))return new Error('Codice errato');
  return e;
}

function api(a,p){
  p=p||{};if(demo)return demoApi(a,p);if(!auth)return Promise.reject(new Error('Configurazione Web Firebase mancante'));var other=me==='biagio'?'mario':'biagio';
  switch(a){
    case 'me':return new Promise(function(res){var un=auth.onAuthStateChanged(function(user){un();var u=uOf(user);if(u)seed().then(function(){res({u:u})},function(){res({u:u})});else res({u:null})})});
    case 'login':
      if(!EM[p.u])return Promise.reject(new Error('Utente non valido'));
      return auth.signInWithEmailAndPassword(EM[p.u],String(p.pin||'')).then(function(){return seed()}).then(function(){return{u:p.u}},function(e){throw authErr(e)});
    case 'logout':return auth.signOut().then(function(){return{ok:1}});
    case 'poll':return ref('tr').get().then(function(s){return{incoming:trFrom(s).filter(function(t){return t.to===me&&t.status==='pending'})}});
    case 'w_get':return Promise.all([wGet(me),ref('tr').get()]).then(function(r){
      var out=trFrom(r[1]).filter(function(t){return t.from===me}).reverse().slice(0,8);
      return{w:r[0],other:other,outgoing:out}});
    case 'w_entry':{var amt=num(p.amount);if(amt===0)return Promise.reject(new Error('Importo non valido'));
      return wMod(me,function(w){w.entries.push(ent(amt,String(p.desc||'').trim().slice(0,200),false))})}
    case 'w_op':{var c=num(p.caricato),t=num(p.tornato),s=String(p.sito||'').trim().slice(0,100);
      if(s===''||c<0||t<0)return Promise.reject(new Error('Dati non validi'));
      return wMod(me,function(w){w.ops.push({id:nid(),ts:NOW(),sito:s,caricato:c,tornato:t})})}
    case 'w_note':{var x=String(p.text||'').trim().slice(0,2000);if(x==='')return Promise.reject(new Error('Nota vuota'));
      return wMod(me,function(w){w.notes.push({id:nid(),ts:NOW(),text:x})})}
    case 'w_edit':{var k=p.kind;if(['entries','ops','notes'].indexOf(k)<0)return Promise.reject(new Error('Errore'));
      return wMod(me,function(w){
        var e=w[k].filter(function(y){return y.id===p.id})[0];
        if(!e)bad('Non trovato');if(e.auto)bad('Movimento automatico non modificabile');
        if(k==='ops'){var c=num(p.caricato),t=num(p.tornato),s=String(p.sito||'').trim().slice(0,100);if(s===''||c<0||t<0)bad('Dati non validi');e.sito=s;e.caricato=c;e.tornato=t}
        else if(k==='entries'){var am=num(p.amount);if(am===0)bad('Importo non valido');e.amount=Math.round(am*100)/100;e.desc=String(p.desc||'').trim().slice(0,200)}
        else{var tx=String(p.text||'').trim().slice(0,2000);if(tx==='')bad('Nota vuota');e.text=tx}
      })}
    case 'w_del':{var kk=p.kind;if(['entries','ops','notes'].indexOf(kk)<0)return Promise.reject(new Error('Errore'));
      return wMod(me,function(w){w[kk]=w[kk].filter(function(e){return e.id!==p.id||!!e.auto})})}
    case 'tr_create':{var am2=Math.round(num(p.amount)*100)/100;if(am2<=0)return Promise.reject(new Error('Importo non valido'));
      var note=String(p.note||'').trim().slice(0,120),rt=ref('tr');
      return db.runTransaction(function(t){return t.get(rt).then(function(s){var l=trFrom(s);l.push({id:nid(),ts:NOW(),from:me,to:other,amount:am2,status:'pending',note:note});t.set(rt,{list:l})})}).then(function(){return{ok:1}})}
    case 'tr_all':return ref('tr').get().then(function(s){return{list:trFrom(s)}});
    case 'tr_answer':{
      var rtr=ref('tr'),adm=me==='biagio';
      return db.runTransaction(function(t){return t.get(rtr).then(function(st){
        var l=trFrom(st),x=l.filter(function(y){return y.id===p.id&&y.status==='pending'})[0];
        if(!x)bad('Richiesta non trovata o già gestita');
        if(p.cancel){if(x.from!==me&&!adm)bad('Puoi annullare solo le tue richieste');x.status='cx';x.ats=NOW();x.by=me;t.set(rtr,{list:l});return}
        if(x.to!==me&&!(p.force&&adm))bad('Solo il destinatario può rispondere');
        if(!p.ok){x.status='no';x.ats=NOW();x.by=me;t.set(rtr,{list:l});return}
        var rm=ref('w_'+x.to),rf=ref('w_'+x.from),nt=x.note?' · '+x.note:'';
        return Promise.all([t.get(rm),t.get(rf)]).then(function(s){
          var wm=wFrom(s[0]),wf=wFrom(s[1]);x.status='ok';x.ats=NOW();x.by=me;if(x.to!==me)x.forced=true;
          wm.entries.push(ent(x.amount,'Da '+NAMES[x.from]+nt,true));
          wf.entries.push(ent(-x.amount,'Dato a '+NAMES[x.to]+nt,true));
          t.set(rtr,{list:l});t.set(rm,wm);t.set(rf,wf);
        });
      })}).then(function(){return{ok:1}})}
    case 'list_get':{if(['chat','tickets','news','tr'].indexOf(p.name)<0)return Promise.reject(new Error('Errore'));return ref(p.name).get().then(trFrom)}
    case 'chat_send':{var tx=String(p.text||'').trim().slice(0,2000);if(!tx)return Promise.reject(new Error('Messaggio vuoto'));
      return lMod('chat',function(l){l.push({id:nid(),ts:NOW(),from:me,text:tx});if(l.length>600)l.splice(0,l.length-600)})}
    case 'chat_del':return lMod('chat',function(l){if(me!=='biagio')bad('Solo l’amministratore può eliminare i messaggi');var i=l.findIndex(function(m){return m.id===p.id});if(i>=0)l.splice(i,1)});
    case 'ticket_new':{var tt=String(p.title||'').trim().slice(0,120),td=String(p.text||'').trim().slice(0,3000),tc=['idea','novita','bug','altro'].indexOf(p.cat)>=0?p.cat:'altro';
      if(!tt)return Promise.reject(new Error('Inserisci un titolo'));
      return lMod('tickets',function(l){l.push({id:nid(),ts:NOW(),by:me,title:tt,cat:tc,text:td,status:'aperta',replies:[]})})}
    case 'ticket_reply':{var rx=String(p.text||'').trim().slice(0,2000);if(!rx)return Promise.reject(new Error('Risposta vuota'));
      return lMod('tickets',function(l){var k=l.filter(function(x){return x.id===p.id})[0];if(!k)bad('Segnalazione non trovata');k.replies=k.replies||[];k.replies.push({id:nid(),ts:NOW(),by:me,text:rx})})}
    case 'ticket_status':return lMod('tickets',function(l){if(me!=='biagio')bad('Solo l’amministratore può cambiare lo stato');if(!STAT[p.status])bad('Stato non valido');var k=l.filter(function(x){return x.id===p.id})[0];if(!k)bad('Segnalazione non trovata');k.status=p.status;k.sts=NOW();k.sby=me});
    case 'ticket_del':return lMod('tickets',function(l){if(me!=='biagio')bad('Solo l’amministratore può eliminare le segnalazioni');var i=l.findIndex(function(x){return x.id===p.id});if(i>=0)l.splice(i,1)});
    case 'news_add':{var nt2=String(p.title||'').trim().slice(0,120),nx=String(p.text||'').trim().slice(0,2000),nk=['info','update','alert'].indexOf(p.kind)>=0?p.kind:'info';
      if(me!=='biagio')return Promise.reject(new Error('Solo l’amministratore può pubblicare avvisi'));if(!nt2)return Promise.reject(new Error('Inserisci un titolo'));
      return lMod('news',function(l){l.push({id:nid(),ts:NOW(),by:me,title:nt2,text:nx,kind:nk});if(l.length>200)l.splice(0,l.length-200)})}
    case 'news_del':return lMod('news',function(l){if(me!=='biagio')bad('Solo l’amministratore');var i=l.findIndex(function(x){return x.id===p.id});if(i>=0)l.splice(i,1)});
    case 'client_credit':{
      var rc=ref('clients'),rw=ref('w_'+me);
      return db.runTransaction(function(t){return Promise.all([t.get(rc),t.get(rw)]).then(function(sn){
        var d=sn[0].exists?sn[0].data():null;if(!d||!d.data)bad('Salva prima il cliente');
        if(d.rev!==p.rev)bad('Dati aggiornati da un altro account: ricarica prima di procedere');
        var c=d.data.list.filter(function(x){return x.id===p.id})[0];if(!c)bad('Cliente non trovato');
        var result=WalletFinance.transfer(c,me,p.amount);var w=wFrom(sn[1]);
        c.credited=result.credited;var entry=ent(result.amount,'Guadagno cliente · '+c.nome,true);entry.clientId=c.id;w.entries.push(entry);
        t.set(rc,{rev:d.rev+1,data:clean(d.data),by:me,ts:NOW()});t.set(rw,w);return{ok:1};
      })});
    }
    case 'doc_get':{if(['calc','clients'].indexOf(p.name)<0)return Promise.reject(new Error('Errore'));
      return ref(p.name).get().then(function(s){return s.exists?s.data():{rev:0,data:null,by:null}})}
    case 'doc_save':{if(['calc','clients'].indexOf(p.name)<0)return Promise.reject(new Error('Errore'));
      var r=ref(p.name);
      return db.runTransaction(function(t){return t.get(r).then(function(s){
        var cur=s.exists?s.data():{rev:0,data:null,by:null};
        if(+p.rev!==+cur.rev)return Object.assign({conflict:true},cur);
        if(p.name==='clients'){(p.data.list||[]).forEach(function(c){WalletFinance.summary(c);var prev=cur.data&&(cur.data.list||[]).filter(function(x){return x.id===c.id})[0];if(num(c.credited)!==num(prev&&prev.credited))bad('Gli accrediti wallet non sono modificabili manualmente');if(prev&&num(prev.credited)>0&&c.owner!==prev.owner)bad('Non cambiare account dopo un accredito')});(cur.data&&cur.data.list||[]).forEach(function(c){if(num(c.credited)>0&&!(p.data.list||[]).some(function(x){return x.id===c.id}))bad('Un cliente con accrediti non può essere eliminato')})}var n={rev:cur.rev+1,data:clean(p.data),by:me,ts:NOW()};t.set(r,n);return{rev:n.rev};
      })})}
    case 'conclude':{
      var rc=ref('calc'),r1=ref('w_biagio'),r2=ref('w_mario');
      return db.runTransaction(function(t){return Promise.all([t.get(rc),t.get(r1),t.get(r2)]).then(function(s){
        var c=s[0].exists?s[0].data():null;if(!c||!c.data)bad('Salva prima il calcolo');
        var d=c.data,pgx=(d.pages||[]).filter(function(y){return y.id===p.pid})[0];
        if(!pgx)bad('Calcolo non trovato (salva e riprova)');
        if(pgx.concluded)bad('Già concluso');
        var es=String(p.esito==null?'eurobet':p.esito);
        var pers=Math.max(1,Math.round(num(pgx.persone))||1),qual=num(pgx.qualifica),vin=num(pgx.vincita);
        var perse=0,cum=0,res=null;
        pgx.steps.forEach(function(st,i){
          var pp=st.nonCop?0:num(st.puntata),q=num(st.quota);cum+=pp;
          if(es===String(i)&&!st.vinta&&!st.nonCop&&pp>0)res=pp*q-(perse+pp+qual);
          perse+=pp;
        });
        if(es==='eurobet')res=vin-cum-qual;
        if(res===null)bad('Esito non valido');
        var per=Math.round(res/pers*100)/100,w1=wFrom(s[1]),w2=wFrom(s[2]);
        w1.entries.push(ent(per,'vincita batchedbetting eurobet',true));
        w2.entries.push(ent(per,'vincita batchedbetting eurobet',true));
        pgx.concluded={ts:NOW(),by:me,per:per,esito:es};
        var cv=covSum(pgx);d.ledger=d.ledger||[];d.ledger.push({id:nid(),ts:NOW(),name:pgx.name,b:cv.b,m:cv.m});
        t.set(rc,{rev:c.rev+1,data:clean(d),by:me,ts:NOW()});t.set(r1,w1);t.set(r2,w2);
        return{per:per};
      })})}
  }
  return Promise.reject(new Error('Azione sconosciuta'));
}

function pg(){var d=docs.calc.data;if(cpage>=d.pages.length||cpage<0)cpage=0;return d.pages[cpage]}
function calcAll(d){
  var P=Math.max(1,Math.round(num(d.persone))||1),Q=num(d.qualifica),V=num(d.vincita),perse=0,cum=0;
  var rows=d.steps.map(function(s){var p=s.nonCop?0:num(s.puntata),q=num(s.quota);cum+=p;var net=p*q-(perse+p+Q);perse+=p;return{p:p,net:net/P,cum:cum/P}});
  return{P:P,Q:Q,V:V,rows:rows,cum:cum,fin:(V-cum-Q)/P};
}

  '<div class="alert" id="al" hidden></div><div id="steps"></div><div class="actions" style="margin-bottom:10px"><button class="btn" data-act="sadd">+ Aggiungi step</button><button class="btn del" data-act="srem">− Elimina ultimo</button></div>'+

function calcUpd(){
  var d=pg(),a=calcAll(d),b=num(d.budget),first=0,cards=document.querySelectorAll('#steps .step');
  cards.forEach(function(card,i){
    var s=d.steps[i],r=a.rows[i],out=card.querySelector('.out'),over=b>0&&r.cum>b+.005;if(over&&!first)first=i+1;

var trAll=[],SALDO='Saldo debiti calcoli';
function covSum(p){var b=0,m=0;(p.steps||[]).forEach(function(s){if(s.nonCop)return;b+=num(s.cb);m+=num(s.cm)});return{b:Math.round(b*100)/100,m:Math.round(m*100)/100}}
function debtCalc(){
  var D=docs.calc.data,B=0,M=0,rows=[];
  (D.ledger||[]).forEach(function(l){B+=num(l.b);M+=num(l.m);rows.push({name:l.name,b:num(l.b),m:num(l.m),ts:l.ts,done:true})});
  D.pages.forEach(function(p){if(p.concluded)return;var c=covSum(p);if(c.b||c.m){B+=c.b;M+=c.m;rows.push({name:p.name,b:c.b,m:c.m,done:false})}});

  var owe=Math.round(((B-M)/2-paidM+paidB)*100)/100; /* >0 Mario deve a Biagio */

}

   (me===deb?(pend?'<div class="meta">Richiesta di saldo in attesa di conferma.</div>':'<button class="btn pri" data-act="debtpay" style="width:100%">Salda '+eur(a)+' a '+esc(NAMES[cre])+' dal wallet</button>'):'<div class="meta">'+(pend?'Richiesta di saldo in attesa: accettala dalla campanella o dal wallet.':'Quando '+esc(NAMES[deb])+' salda, il pagamento passa dal suo wallet al tuo.')+'</div>'))+

function feed(){
  if(!me)return Promise.resolve();
  return Promise.all(['news','chat','tickets','tr'].map(function(n){return api('list_get',{name:n})})).then(function(r){
    var it=[];
    r[0].forEach(function(n){it.push({ts:n.ts,k:n.kind==='alert'?'alert':'news',title:n.title,text:n.text,id:n.id,news:1,kind:n.kind})});
    r[1].filter(function(m){return m.from!==me}).slice(-15).forEach(function(m){it.push({ts:m.ts,k:'chat',title:'Messaggio da '+NAMES[m.from],text:m.text,go:'chat'})});
    r[2].forEach(function(t){
      if(t.by!==me)it.push({ts:t.ts,k:'ticket',title:'Nuova segnalazione: '+t.title,text:CAT[t.cat]||'',go:'tickets',tid:t.id});
      (t.replies||[]).forEach(function(x){if(x.by!==me)it.push({ts:x.ts,k:'ticket',title:'Risposta su «'+t.title+'»',text:x.text,go:'tickets',tid:t.id})});
      if(t.sts&&t.sby!==me)it.push({ts:t.sts,k:'ticket',title:'Stato aggiornato: '+t.title,text:STAT[t.status],go:'tickets',tid:t.id});
    });
    r[3].forEach(function(x){
      if(x.to===me&&x.status==='pending')it.push({ts:x.ts,k:'pay',title:NAMES[x.from]+' vuole inviarti '+eur(x.amount),text:x.note||'In attesa della tua conferma',go:'chat'});
      if(x.ats&&x.by!==me&&(x.from===me||x.to===me))it.push({ts:x.ats,k:'pay',title:'Trasferimento '+(TRS[x.status]||'').toLowerCase()+(x.forced?' (forzato da admin)':''),text:eur(x.amount)+' · '+NAMES[x.from]+' → '+NAMES[x.to],go:'chat'});
    });
    feedItems=it.sort(function(a,b){return b.ts-a.ts}).slice(0,50);
    var s=seen(),unread=feedItems.filter(function(x){return x.ts>s});
    var nb=$('#nb');if(nb){nb.hidden=!unread.length;nb.textContent=unread.length>9?'9+':unread.length}
    var top=unread[0];

    if($('#np'))npRender();
  }).catch(function(){});
}
