</style><script>/* Pure accounting helpers; all amounts are rounded to integer cents. */
(function(root){
  function cents(v){var n=Number(String(v==null?'0':v).replace(',','.'));if(!Number.isFinite(n)||n<0)throw new Error('Inserisci un importo positivo valido');return Math.round(n*100)}
  function summary(c){var generated=cents(c.generated),allocated=cents(c.clientShare),paid=cents(c.clientPaid),credited=cents(c.credited);if(allocated>generated)throw new Error('La quota cliente supera il guadagno generato');if(paid>allocated)throw new Error('Il pagamento cliente supera la sua quota');if(credited>generated-allocated)throw new Error('Importo già accreditato superiore alla quota disponibile');return{generated:generated/100,clientShare:allocated/100,clientPaid:paid/100,clientDue:(allocated-paid)/100,operatorShare:(generated-allocated)/100,credited:credited/100,available:(generated-allocated-credited)/100,toDivide:(generated-paid-credited)/100}}
  function transfer(c,account,amount){if(['biagio','mario'].indexOf(account)<0||c.owner!==account)throw new Error('Il cliente non è assegnato a questo account');var s=summary(c),a=cents(amount);if(a<=0||a>Math.round(s.available*100))throw new Error('Importo superiore ai fondi disponibili');return{amount:a/100,credited:(cents(c.credited)+a)/100}}
  root.WalletFinance={summary:summary,transfer:transfer};
})(globalThis);

var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
var eur=function(n){return n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'};
var sg=function(n){return(n>=0?'+':'−')+eur(Math.abs(n))};

function connectFirebase(){if(!CFG.apiKey)throw new Error('Inserisci la configurazione Web pubblica Firebase');if(!firebase.apps.length)firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();col=db.collection('bb')}

    case 'me':return new Promise(function(res){var un=auth.onAuthStateChanged(function(user){un();var u=uOf(user);if(u)seed().then(function(){res({u:u})},function(){res({u:u})});else res({u:null})})});
    case 'login':

      return wMod(me,function(w){w.ops.push({id:nid(),ts:NOW(),sito:s,caricato:c,tornato:t})})}
    case 'w_note':{var x=String(p.text||'').trim().slice(0,2000);if(x==='')return Promise.reject(new Error('Nota vuota'));
      return wMod(me,function(w){w.notes.push({id:nid(),ts:NOW(),text:x})})}
    case 'w_edit':{var k=p.kind;if(['entries','ops','notes'].indexOf(k)<0)return Promise.reject(new Error('Errore'));
      return wMod(me,function(w){
        var e=w[k].filter(function(y){return y.id===p.id})[0];
        if(!e)bad('Non trovato');if(e.auto)bad('Movimento automatico non modificabile');
        if(k==='ops'){var c=num(p.caricato),t=num(p.tornato),s=String(p.sito||'').trim().slice(0,100);if(s===''||c<0||t<0)bad('Dati non validi');e.sito=s;e.caricato=c;e.tornato=t}
        else if(k==='entries'){var am=num(p.amount);if(am===0)bad('Importo non valido');e.amount=Math.round(am*100)/100;e.desc=String(p.desc||'').trim().slice(0,200)}
        else{var tx=String(p.text||'').trim().slice(0,2000);if(tx==='')bad('Nota vuota');e.text=tx}
      })}
    case 'w_del':{var kk=p.kind;if(['entries','ops','notes'].indexOf(kk)<0)return Promise.reject(new Error('Errore'));
      return wMod(me,function(w){w[kk]=w[kk].filter(function(e){return e.id!==p.id||!!e.auto})})}
    case 'tr_create':{var am2=Math.round(num(p.amount)*100)/100;if(am2<=0)return Promise.reject(new Error('Importo non valido'));
      var rt=ref('tr');
      return db.runTransaction(function(t){return t.get(rt).then(function(s){var l=trFrom(s);l.push({id:nid(),ts:NOW(),from:me,to:other,amount:am2,status:'pending'});t.set(rt,{list:l})})}).then(function(){return{ok:1}})}
    case 'tr_answer':{
      var rtr=ref('tr');
      return db.runTransaction(function(t){return t.get(rtr).then(function(st){
        var l=trFrom(st),x=l.filter(function(y){return y.id===p.id&&y.to===me&&y.status==='pending'})[0];
        if(!x)bad('Richiesta non trovata');
        if(!p.ok){x.status='no';t.set(rtr,{list:l});return}
        var rm=ref('w_'+me),rf=ref('w_'+x.from);
        return Promise.all([t.get(rm),t.get(rf)]).then(function(s){
          var wm=wFrom(s[0]),wf=wFrom(s[1]);x.status='ok';
          wm.entries.push(ent(x.amount,'Da '+NAMES[x.from],true));
          wf.entries.push(ent(-x.amount,'Dato a '+NAMES[me],true));
          t.set(rtr,{list:l});t.set(rm,wm);t.set(rf,wf);
        });
      })}).then(function(){return{ok:1}})}
    case 'client_credit':{
      var rc=ref('clients'),rw=ref('w_'+me);
      return db.runTransaction(function(t){return Promise.all([t.get(rc),t.get(rw)]).then(function(sn){
        var d=sn[0].exists?sn[0].data():null;if(!d||!d.data)bad('Salva prima il cliente');
        if(d.rev!==p.rev)bad('Dati aggiornati da un altro account: ricarica prima di procedere');
        var c=d.data.list.filter(function(x){return x.id===p.id})[0];if(!c)bad('Cliente non trovato');
        var result=WalletFinance.transfer(c,me,p.amount);var w=wFrom(sn[1]);
        c.credited=result.credited;var entry=ent(result.amount,'Guadagno cliente · '+c.nome,true);entry.clientId=c.id;w.entries.push(entry);
        t.set(rc,{rev:d.rev+1,data:clean(d.data),by:me,ts:NOW()});t.set(rw,w);return{ok:1};
      })});
    }
    case 'doc_get':{if(['calc','clients'].indexOf(p.name)<0)return Promise.reject(new Error('Errore'));
      return ref(p.name).get().then(function(s){return s.exists?s.data():{rev:0,data:null,by:null}})}
    case 'doc_save':{if(['calc','clients'].indexOf(p.name)<0)return Promise.reject(new Error('Errore'));
      var r=ref(p.name);
      return db.runTransaction(function(t){return t.get(r).then(function(s){
        var cur=s.exists?s.data():{rev:0,data:null,by:null};
        if(+p.rev!==+cur.rev)return Object.assign({conflict:true},cur);
        if(p.name==='clients'){(p.data.list||[]).forEach(function(c){WalletFinance.summary(c);var prev=cur.data&&(cur.data.list||[]).filter(function(x){return x.id===c.id})[0];if(num(c.credited)!==num(prev&&prev.credited))bad('Gli accrediti wallet non sono modificabili manualmente');if(prev&&num(prev.credited)>0&&c.owner!==prev.owner)bad('Non cambiare account dopo un accredito')});(cur.data&&cur.data.list||[]).forEach(function(c){if(num(c.credited)>0&&!(p.data.list||[]).some(function(x){return x.id===c.id}))bad('Un cliente con accrediti non può essere eliminato')})}var n={rev:cur.rev+1,data:clean(p.data),by:me,ts:NOW()};t.set(r,n);return{rev:n.rev};
      })})}
    case 'conclude':{
      var rc=ref('calc'),r1=ref('w_biagio'),r2=ref('w_mario');
      return db.runTransaction(function(t){return Promise.all([t.get(rc),t.get(r1),t.get(r2)]).then(function(s){
        var c=s[0].exists?s[0].data():null;if(!c||!c.data)bad('Salva prima il calcolo');
        var d=c.data,pgx=(d.pages||[]).filter(function(y){return y.id===p.pid})[0];
        if(!pgx)bad('Calcolo non trovato (salva e riprova)');
        if(pgx.concluded)bad('Già concluso');
        var es=String(p.esito==null?'eurobet':p.esito);
        var pers=Math.max(1,Math.round(num(pgx.persone))||1),qual=num(pgx.qualifica),vin=num(pgx.vincita);
        var perse=0,cum=0,res=null;
        pgx.steps.forEach(function(st,i){
          var pp=st.nonCop?0:num(st.puntata),q=num(st.quota);cum+=pp;
          if(es===String(i)&&!st.vinta&&!st.nonCop&&pp>0)res=pp*q-(perse+pp+qual);
          perse+=pp;
        });
        if(es==='eurobet')res=vin-cum-qual;
        if(res===null)bad('Esito non valido');
        var per=Math.round(res/pers*100)/100,w1=wFrom(s[1]),w2=wFrom(s[2]);
        w1.entries.push(ent(per,'vincita batchedbetting eurobet',true));
        w2.entries.push(ent(per,'vincita batchedbetting eurobet',true));
        pgx.concluded={ts:NOW(),by:me,per:per,esito:es};
        t.set(rc,{rev:c.rev+1,data:clean(d),by:me,ts:NOW()});t.set(r1,w1);t.set(r2,w2);
        return{per:per};
      })})}
  }
  return Promise.reject(new Error('Azione sconosciuta'));
}

function defData(n){

  var p=newPage('Calcolo attuale');return{pages:[p]};
}
/* Compatibilita': vecchio formato (un solo calcolo + coda) -> schede */
function normCalc(d){
  if(d.pages&&d.pages.length)return d;
  var first={id:nid(),name:'Calcolo attuale',budget:d.budget||'400',persone:d.persone||'2',vincita:d.vincita||'',qualifica:d.qualifica||'0',steps:d.steps||newPage('x').steps};
  if(d.concluded)first.concluded=d.concluded;
  var pages=[first];
  (d.coda||[]).forEach(function(x){var s=x.snap||{};pages.push({id:x.id||nid(),name:x.titolo||'Calcolo prossimo',budget:s.budget,persone:s.persone,vincita:s.vincita,qualifica:s.qualifica,steps:s.steps||newPage('x').steps})});
  return{pages:pages};
}
function setDoc(n,r){var d=r.data||defData(n);if(n==='calc')d=normCalc(d);docs[n]={rev:r.rev,data:d,saved:JSON.stringify(d),by:r.by,stale:false}}
function loadDoc(n){return api('doc_get',{name:n}).then(function(r){setDoc(n,r)})}
function dirty(n){var D=docs[n];return D&&JSON.stringify(D.data)!==D.saved}
function docPoll(n){
  if(n!=='calc'&&n!=='clients'||!docs[n])return;
  api('doc_get',{name:n}).then(function(r){
    var D=docs[n];if(!D||r.rev<=D.rev)return;
    if(dirty(n)){D.stale=true;bar()}
    else if(!(document.activeElement&&view.contains(document.activeElement)&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))){setDoc(n,r);if(tab===n){render(n);bar()}}
  }).catch(function(){});
}
function bar(){
  var s=$('#sbar');if(!s)return;
  if(tab!=='calc'&&tab!=='clients'){s.hidden=true;return}
  var D=docs[tab];if(!D){s.hidden=true;return}
  var dr=dirty(tab);s.hidden=false;
  s.innerHTML='<span class="msg">'+(D.stale?'⚠ '+esc(NAMES[D.by]||'')+' ha salvato modifiche: premi Annulla per aggiornare':dr?'<strong>Modifiche non salvate</strong>':'Salvato'+(D.by?' · ultima modifica '+esc(NAMES[D.by]):''))+'</span><button class="btn" data-act="cancel"'+(dr||D.stale?'':' disabled')+'>Annulla</button><button class="btn pri" data-act="save"'+(dr&&!D.stale?'':' disabled')+'>Salva</button>';

function save(){
  var n=tab,D=docs[n];
  api('doc_save',{name:n,rev:D.rev,data:D.data}).then(function(r){
    if(r.conflict){D.stale=true;D.by=r.by;bar();alert(NAMES[r.by]+' ha salvato modifiche nel frattempo. Premi Annulla per caricare la sua versione.');return}
    D.rev=r.rev;D.saved=JSON.stringify(D.data);D.by=me;D.stale=false;bar();render(n);
  }).catch(fail);
}
function cancel(){
  var n=tab,D=docs[n];
  if(!D.stale&&!confirm('Annullare le modifiche non salvate?'))return;
  if(D.stale){loadDoc(n).then(function(){render(n);bar()}).catch(fail)}

/* ---------- CALCOLATORE (a schede) ---------- */
function pg(){var d=docs.calc.data;if(cpage>=d.pages.length||cpage<0)cpage=0;return d.pages[cpage]}
function calcAll(d){
  var P=Math.max(1,Math.round(num(d.persone))||1),Q=num(d.qualifica),V=num(d.vincita),perse=0,cum=0;
  var rows=d.steps.map(function(s){var p=s.nonCop?0:num(s.puntata),q=num(s.quota);cum+=p;var net=p*q-(perse+p+Q);perse+=p;return{p:p,net:net/P,cum:cum/P}});
  return{P:P,Q:Q,V:V,rows:rows,cum:cum,fin:(V-cum-Q)/P};
}
function calcView(){
  var D=docs.calc.data,d=pg(),c=d.concluded;
  var tabs=D.pages.map(function(p,i){return'<button class="ptab'+(i===cpage?' on':'')+'" data-act="pgo" data-i="'+i+'">'+esc(p.name)+(p.concluded?' ✓':'')+'</button>'}).join('')+'<button class="ptab" data-act="padd" aria-label="Nuovo calcolo">+</button>';
  view.innerHTML='<div class="ptabs">'+tabs+'</div>'+
  '<div class="actions" style="margin-bottom:6px"><button class="btn" data-act="prn">✎ Rinomina calcolo</button><button class="btn del" data-act="pdel"'+(D.pages.length>1?'':' disabled')+'>Elimina calcolo</button></div>'+
  '<h1>'+esc(d.name)+'</h1>'+(c?'<div class="ok">Concluso il '+new Date(c.ts*1000).toLocaleString('it-IT')+' da '+esc(NAMES[c.by])+': '+sg(c.per)+' a testa accreditati nei wallet.<br><button class="btn" data-act="newcalc" style="margin-top:8px">Nuovo calcolo</button></div>':'')+
  '<fieldset '+(c?'disabled':'')+'><div class="params">'+[['budget','Budget max a testa (€)'],['persone','Persone'],['vincita','Vincita netta Eurobet (€)'],['qualifica','Perdita di qualifica (€)']].map(function(x){return'<div class="cell"><label>'+x[1]+'</label><input data-k="'+x[0]+'" inputmode="decimal" value="'+esc(d[x[0]])+'"></div>'}).join('')+'</div>'+
  '<div class="alert" id="al" hidden></div><div id="steps"></div><div class="actions" style="margin-bottom:10px"><button class="btn" data-act="sadd">+ Aggiungi step</button><button class="btn del" data-act="srem">− Elimina ultimo</button></div>'+
  '<div class="final"><div style="display:flex;justify-content:space-between;gap:8px"><div>Se vince Eurobet fino in fondo<div class="meta" id="fm"></div></div><div class="out" id="fo" style="min-height:0;white-space:nowrap"></div></div></div>'+
  '<div class="card"><h2>Concludi</h2><div class="cell"><label>Esito</label><select id="es"></select></div><div class="meta" id="ev2" style="margin:6px 0"></div><button class="btn pri" data-act="concl" style="width:100%">Concludi e accredita nei wallet</button></div></fieldset>'+
  '<button class="btn pri" data-act="padd" style="width:100%;margin-bottom:10px">Crea calcolo futuro</button>'+
  '<div class="meta" style="margin-bottom:10px">I calcoli futuri restano in coda nelle schede in alto: quando concludi quello attuale, con «Nuovo calcolo» il successivo diventa quello attuale.</div>';
  calcSteps();calcUpd();
}
function calcSteps(){
  var d=pg();
  $('#steps').innerHTML=d.steps.map(function(s,i){var k=i+1;
    return'<div class="step" data-i="'+i+'"><div class="head"><span class="n">Step '+k+'</span><input data-f="partita" value="'+esc(s.partita)+'" placeholder="Partita"></div><div class="row"><div class="cell"><label>Quota</label><input data-f="quota" inputmode="decimal" value="'+esc(s.quota)+'"></div><div class="cell"><label>Puntata totale (€)</label><input data-f="puntata" inputmode="decimal" value="'+esc(s.puntata)+'"></div><div class="cell"><label>Netto a testa</label><div class="out"></div></div></div>'+
    '<label class="chk"><input type="checkbox" data-c="nonCop"'+(s.nonCop?' checked':'')+'> Quota non coperta</label><label class="chk"><input type="checkbox" data-c="vinta"'+(s.vinta?' checked':'')+'> Partita vinta su Eurobet (copertura persa)</label><div class="meta"></div><div class="alert" hidden style="margin:8px 0 0"></div></div>'}).join('');
}
function calcUpd(){
  var d=pg(),a=calcAll(d),b=num(d.budget),first=0,cards=document.querySelectorAll('#steps .step');
  cards.forEach(function(card,i){
    var s=d.steps[i],r=a.rows[i],out=card.querySelector('.out'),over=b>0&&r.cum>b+.005;if(over&&!first)first=i+1;
    if(s.nonCop){out.textContent='non coperta';out.className='out muted'}
    else if(s.vinta){out.textContent='persa';out.className='out muted'}
    else if(r.p>0&&num(s.quota)>0){out.textContent=sg(r.net);out.className='out '+(r.net>=0?'pos':'neg')}
    else{out.textContent='–';out.className='out'}
    card.querySelector('.meta').textContent='A testa '+eur(r.p/a.P)+' · Cassa cumulata '+eur(r.cum)+' a testa'+(s.vinta&&!s.nonCop?' · costo non recuperato':'');
    card.className='step'+(over?' over':'');
    var er=card.querySelector('.alert');er.hidden=!over;er.textContent=over?'Errore: superi il budget di '+eur(r.cum-b)+' a testa.':'';
  });
  var al=$('#al');al.hidden=!first;al.textContent=first?'Errore: dallo step '+first+' la cassa supera il budget massimo di '+eur(b)+' a testa.':'';
  $('#fo').textContent=sg(a.fin)+' a testa';$('#fo').className='out '+(a.fin>=0?'pos':'neg');
  $('#fm').textContent='Vincita netta '+eur(a.V)+' − coperture '+eur(a.cum)+' − qualifica '+eur(a.Q);
  var es=$('#es'),cur=es.value||'eurobet',o='<option value="eurobet">Eurobet vince tutto</option>';
  d.steps.forEach(function(s,i){if(!s.vinta&&!s.nonCop&&a.rows[i].p>0&&num(s.quota)>0)o+='<option value="'+i+'">Vince copertura step '+(i+1)+(s.partita?' – '+esc(s.partita):'')+'</option>'});
  if(es.innerHTML!==o)es.innerHTML=o;es.value=cur;if(es.value!==cur)es.value='eurobet';
  $('#ev2').textContent='A testa a Biagio e Mario: '+sg(esitoVal(es.value));
  bar();
}
function esitoVal(e){var a=calcAll(pg());return e==='eurobet'?a.fin:(a.rows[+e]?a.rows[+e].net:0)}
function concl(){
  if(dirty('calc')){alert('Prima salva le modifiche.');return}
  var e=$('#es').value,v=esitoVal(e),id=pg().id;
  if(!confirm('Accreditare '+sg(v)+' a testa a Biagio e Mario ("vincita batchedbetting eurobet")?'))return;

}
