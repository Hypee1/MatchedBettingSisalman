.bellw{position:relative}.nbadge{position:absolute;top:-2px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--neg);color:var(--card);font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1}

.np-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.np-admin{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:8px;background:var(--field)}.np-admin textarea{min-height:60px}
.np-item{display:flex;gap:11px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer}.np-item:hover{background:var(--field)}.np-item.unread{background:var(--ok-bg)}.np-item p{font-size:12px;color:var(--muted);white-space:pre-wrap;margin-top:2px}.np-item strong{font-size:13px}.np-item>div{flex:1;min-width:0}
.np-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--field);color:var(--accent);flex-shrink:0}.np-ic.k-alert{background:var(--neg-bg);color:var(--neg)}.np-ic.k-pay{background:var(--warm);color:var(--ink)}
.admin-tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.chat-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.chat{display:flex;flex-direction:column;height:min(620px,72vh)}
.msgs{flex:1;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:10px;background:var(--field)}
.msg{max-width:72%;padding:10px 13px;border-radius:12px 12px 12px 3px;background:var(--card);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.msg.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:12px 12px 3px 12px}
.msg .mt{font-size:10px;opacity:.7;margin-top:4px;display:flex;align-items:center;gap:6px}.msg .mt button{border:0;background:none;color:inherit;padding:0;font-size:10px;text-decoration:underline}

/* ================= SCELTA DISPOSITIVO + VERSIONE MOBILE (web app) ================= */
.bnav,.mbrand,#ptr{display:none}
[data-dev=mobile] .pc-only{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadein{from{opacity:0}}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:40;display:grid;gap:8px;width:min(calc(100vw - 32px),420px);pointer-events:none}
.toast{background:var(--ink);color:var(--card);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:650;box-shadow:0 12px 32px oklch(0 0 0 / .25);animation:tin .25s ease;transition:opacity .3s}
.toast.err{background:var(--neg);color:#fff}
.offline-bar{position:fixed;top:env(safe-area-inset-top);left:50%;transform:translateX(-50%);z-index:41;background:var(--neg);color:#fff;font-size:11px;font-weight:750;padding:4px 12px;border-radius:0 0 10px 10px}
.linkbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:650;min-height:40px}
.linkbtn:hover{color:var(--accent)}
/* schermata di scelta */
.dev-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:760px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
.dev-top{display:flex;justify-content:space-between;align-items:center}
.dev-wrap h1{margin:44px 0 10px;font-size:30px;letter-spacing:-.01em}
.dev-wrap>p{color:var(--muted);margin-bottom:28px;font-size:14px;max-width:520px}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dev-card{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;transition:border-color .15s,transform .15s,box-shadow .15s;box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent}
.dev-card:hover{border-color:var(--accent);box-shadow:0 10px 30px oklch(.2 .02 160 / .08)}
.dev-card:active{transform:scale(.98)}
.dev-card.rec{border-color:var(--accent)}
.dev-ic{width:56px;height:56px;border-radius:16px;background:var(--ok-bg);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.dev-ic svg{width:30px;height:30px}

/* ---------- DOCUMENTI CONDIVISI ---------- */
function defData(n){
  if(n==='clients')return{list:[]};
  var p=newPage('Calcolo attuale');return{pages:[p]};
}
/* Compatibilita': vecchio formato (un solo calcolo + coda) -> schede */
function normCalc(d){
  if(d.pages&&d.pages.length)return d;
  var first={id:nid(),name:'Calcolo attuale',budget:d.budget||'400',persone:d.persone||'2',vincita:d.vincita||'',qualifica:d.qualifica||'0',steps:d.steps||newPage('x').steps};
  if(d.concluded)first.concluded=d.concluded;
  var pages=[first];
  (d.coda||[]).forEach(function(x){var s=x.snap||{};pages.push({id:x.id||nid(),name:x.titolo||'Calcolo prossimo',budget:s.budget,persone:s.persone,vincita:s.vincita,qualifica:s.qualifica,steps:s.steps||newPage('x').steps})});
  return{pages:pages};
}
function setDoc(n,r){var d=r.data||defData(n);if(n==='calc')d=normCalc(d);docs[n]={rev:r.rev,data:d,saved:JSON.stringify(d),by:r.by,stale:false}}
function loadDoc(n){return api('doc_get',{name:n}).then(function(r){setDoc(n,r)})}
function dirty(n){var D=docs[n];return D&&JSON.stringify(D.data)!==D.saved}
function docPoll(n){
  if(n!=='calc'&&n!=='clients'||!docs[n])return;
  api('doc_get',{name:n}).then(function(r){
    var D=docs[n];if(!D||r.rev<=D.rev)return;
    if(dirty(n)){D.stale=true;bar()}
    else if(!(document.activeElement&&view.contains(document.activeElement)&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))){setDoc(n,r);if(tab===n){render(n);bar()}}
  }).catch(function(){});
}
function bar(){
  var s=$('#sbar');if(!s)return;
  if(tab!=='calc'&&tab!=='clients'){s.hidden=true;return}
  var D=docs[tab];if(!D){s.hidden=true;return}
  var dr=dirty(tab);s.hidden=false;
  s.innerHTML='<span class="msg">'+(D.stale?'! '+esc(NAMES[D.by]||'')+' ha salvato modifiche: premi Annulla per aggiornare':dr?'<strong>Modifiche non salvate</strong>':'Salvato'+(D.by?' · ultima modifica '+esc(NAMES[D.by]):''))+'</span><button class="btn" data-act="cancel"'+(dr||D.stale?'':' disabled')+'>Annulla</button><button class="btn pri" data-act="save"'+(dr&&!D.stale?'':' disabled')+'>Salva</button>';
}
function save(){
  var n=tab,D=docs[n];
  api('doc_save',{name:n,rev:D.rev,data:D.data}).then(function(r){
    if(r.conflict){D.stale=true;D.by=r.by;bar();alert(NAMES[r.by]+' ha salvato modifiche nel frattempo. Premi Annulla per caricare la sua versione.');return}
    D.rev=r.rev;D.saved=JSON.stringify(D.data);D.by=me;D.stale=false;bar();render(n);
  }).catch(fail);
}
function cancel(){
  var n=tab,D=docs[n];

   Trova le puntate che danno lo STESSO guadagno a testa in ogni esito
   (qualunque copertura vinca oppure Eurobet fino in fondo).
   Gli step "vinta su Eurobet" e "non coperta" restano come sono. */
function abOpts(){var g=function(id,d){var e=$('#'+id);return e?e.value:d};return{scope:g('abs','all'),round:num(g('abr','0.01'))||.01,cov:g('abc','h')}}
function abSolve(o){
  var d=pg(),V=num(d.vincita),Q=num(d.qualifica),P=Math.max(1,Math.round(num(d.persone))||1),last=-1;
  if(!(V>0))return{err:'Inserisci prima la vincita netta Eurobet.'};
  d.steps.forEach(function(s,i){if(s.vinta)last=i});
  var info=d.steps.map(function(s,i){var fixed=s.nonCop||s.vinta||(o.scope==='rest'&&i<=last);return{s:s,i:i,fixed:fixed,q:num(s.quota),p:s.nonCop?0:num(s.puntata)}});
  var free=info.filter(function(x){return!x.fixed});
  if(!free.length)return{err:'Non ci sono step da bilanciare (sono tutti vinti, non coperti o già giocati).'};
  var bad=free.filter(function(x){return!(x.q>1)});
  if(bad.length)return{err:'Metti prima le quote (maggiori di 1) negli step: '+bad.map(function(x){return x.i+1}).join(', ')+'.'};
  /* cassa prima di ogni step = a + b*X ; risolvo X con la condizione finale V - cassa - Q = X */
  var a=0,b=0;info.forEach(function(x){if(x.fixed){a+=x.p}else{var k=1/(x.q-1),pa=(Q+a)*k,pb=(1+b)*k;a+=pa;b+=pb}});

 if(c==='auth/too-many-requests')return'Troppi tentativi, riprova tra qualche minuto.';
 if(c==='auth/network-request-failed')return'Nessuna connessione.';
 if(c==='auth/operation-not-allowed')return'Registrazione non attiva: avvisa Biagio.';
 if(c==='permission-denied')return'Permesso negato: avvisa Biagio.';
 return(e&&e.message)||'Errore'}
